# Netlify configuration for www.skyshieldroofing.com
# Build: copies only public files into dist/ (see build.mjs). No npm packages are needed
# to build, so NODE_ENV=production keeps Puppeteer and ffmpeg (dev-only tools) off the server.

[build]
  command = "node build.mjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  NODE_ENV = "production"
  PUPPETEER_SKIP_DOWNLOAD = "true"

# ---------------------------------------------------------------------------------------
# Domains. www.skyshieldroofing.com is primary; Netlify sends the bare domain to www.
# skyshieldroofpro.com (the email domain) forwards here once its DNS points at Netlify.
# ---------------------------------------------------------------------------------------
[[redirects]]
  from = "https://skyshieldroofpro.com/*"
  to = "https://www.skyshieldroofing.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.skyshieldroofpro.com/*"
  to = "https://www.skyshieldroofing.com/:splat"
  status = 301
  force = true

# ---------------------------------------------------------------------------------------
# Old Wix URLs -> closest page on the new site (301 keeps Google's existing links and
# rankings flowing to the new pages). Old store/profile junk falls through to the 404.
# ---------------------------------------------------------------------------------------
